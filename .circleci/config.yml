version: 2.1

# CI สำหรับ TOFFY AI YouTube Studio (Next.js + TypeScript)
# ตรวจ 3 ขั้น: ติดตั้ง deps → typecheck → build
# ไม่ต้องใช้ค่า secret ใด ๆ (หน้า dashboard เป็น dynamic เรียก Supabase ตอน runtime เท่านั้น)

jobs:
  build-and-check:
    docker:
      - image: cimg/node:22.11
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-v1-{{ checksum "package-lock.json" }}
            - npm-deps-v1-
      - run:
          name: Install dependencies (npm ci)
          command: npm ci
      - save_cache:
          key: npm-deps-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Type check
          command: npm run typecheck
      - run:
          name: Production build
          command: npm run build

workflows:
  ci:
    jobs:
      - build-and-check
